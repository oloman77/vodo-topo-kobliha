name: Production website smoke test

on:
  push:
    paths:
      - .github/workflows/production-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public DNS and DNSSEC records without changing anything
        shell: bash
        run: |
          set +e
          for type in NS A AAAA MX TXT DS DNSKEY; do
            echo "=== DNS: $type ==="
            dig @1.1.1.1 +time=3 +tries=1 vodotopokobliha.cz "$type" +noall +answer
          done
          echo "=== www DNS ==="
          dig @1.1.1.1 +time=3 +tries=1 www.vodotopokobliha.cz CNAME +noall +answer
          echo "=== DNSSEC via validating resolver ==="
          dig @1.1.1.1 +dnssec +time=3 +tries=1 vodotopokobliha.cz A +noall +comments +answer
      - name: Verify HTTPS, redirects and website resources
        shell: bash
        run: |
          python3 - <<'PY'
          import re, ssl, urllib.error, urllib.request
          from urllib.parse import urljoin

          site = "https://vodotopokobliha.cz/"
          urls = [
              "https://vodotopokobliha.cz/",
              "http://vodotopokobliha.cz/",
              "https://www.vodotopokobliha.cz/",
              "http://www.vodotopokobliha.cz/",
              "https://vodotopokobliha.cz/robots.txt",
              "https://vodotopokobliha.cz/sitemap.xml",
              "https://vodotopokobliha.cz/favicon.svg",
              "https://vodotopokobliha.cz/apple-touch-icon.png",
              "https://vodotopokobliha.cz/assets/social-preview.png",
              "https://vodotopokobliha.cz/assets/optimized/dubicny-800-4a1d5762ee.webp",
              "https://vodotopokobliha.cz/assets/optimized/soho-800-d96b0eef34.webp",
              "https://vodotopokobliha.cz/assets/optimized/lihovar-400-e8af26bc5f.webp",
              "https://vodotopokobliha.cz/assets/optimized/toptower-400-ea88d859a8.webp",
              "https://vodotopokobliha.cz/assets/optimized/footer-1400-07631d13e1.webp",
          ]
          class Tracker(urllib.request.HTTPRedirectHandler):
              def __init__(self):
                  super().__init__()
                  self.chain = []
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.chain.append((code, newurl))
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          for url in urls:
              tracker = Tracker()
              opener = urllib.request.build_opener(tracker)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Kobliha-Production-Smoke-Test/1.0"})
                  with opener.open(req,timeout=15) as response:
                      data=response.read(1_000_000)
                      path=url.replace(site, "/")
                      print(f"URL {url}")
                      print(f"  HTTP {response.status}, final={response.url}")
                      if tracker.chain: print(f"  Redirects: {tracker.chain}")
                      print(f"  Content-Type={response.headers.get('Content-Type')}, Cache-Control={response.headers.get('Cache-Control')}")
                      if path == "/":
                          print("  Has local images:", 'assets/optimized/' in data.decode("utf-8","replace"))
                          print("  Canonical correct:", 'href="https://vodotopokobliha.cz/"' in data.decode("utf-8","replace"))
                          for key in ("X-Content-Type-Options","X-Frame-Options","Referrer-Policy","Permissions-Policy"):
                              print(f"  {key}={response.headers.get(key)}")
              except (urllib.error.URLError, TimeoutError, ssl.SSLError, OSError) as exc:
                  print(f"URL {url} FAILED: {type(exc).__name__}: {exc}")
          PY
