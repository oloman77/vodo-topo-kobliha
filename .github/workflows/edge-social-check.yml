name: Edge and social preview check

on:
  push:
    paths:
      - .github/workflows/edge-social-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Microsoft Edge and browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps msedge
      - name: Check Edge desktop rendering, navigation and photos
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ channel: 'msedge', headless: true });
          try {
            for (const width of [1024, 1440]) {
              const page = await browser.newPage({ viewport: { width, height: 900 } });
              const response = await page.goto('https://vodotopokobliha.cz/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!response || response.status() !== 200) throw Error('Bad HTTP status');
              await page.evaluate(() => document.fonts.ready);
              let problems = [];
              const refs=page.locator('main img');
              if (await refs.count() !== 6) problems.push('Expected exactly six reference photos');
              for(let i=0;i<await refs.count();i++){
                await refs.nth(i).scrollIntoViewIfNeeded();
                const loaded=await refs.nth(i).evaluate(img=>new Promise(resolve=>{
                  if(img.complete)return resolve(img.naturalWidth>0);
                  img.addEventListener('load',()=>resolve(img.naturalWidth>0),{once:true});
                  img.addEventListener('error',()=>resolve(false),{once:true});
                }));
                if(!loaded) problems.push('Image '+i+' failed');
              }
              const layout=await page.evaluate(()=>{
                const nav = document.querySelector('nav.nav');
                const navY=[...nav.querySelectorAll('a')].map(x=>x.getBoundingClientRect().top);
                return { viewport: innerWidth, pageWidth:document.documentElement.scrollWidth,
                  oneRow:navY.every(y=>Math.abs(y-navY[0])<2),
                  localImages:[...document.querySelectorAll('main img')].every(i=>i.currentSrc.includes('/assets/optimized/')),
                  brokenAnchors:[...document.querySelectorAll('a[href^="#"]')].filter(a=>!document.getElementById(a.hash.slice(1))).map(a=>a.hash)
                };
              });
              if(layout.pageWidth>layout.viewport+5) problems.push('Horizontal overflow');
              if(!layout.oneRow) problems.push('Nav wraps');
              if(!layout.localImages) problems.push('External image URL remains');
              if(layout.brokenAnchors.length) problems.push('Invalid anchor links');
              console.log(JSON.stringify({browser:'Microsoft Edge',width,layout,problems}));
              await page.screenshot({path:'edge-'+width+'.png',fullPage:true});
              await page.close();
              if(problems.length) throw Error(problems.join('; '));
            }
            console.log('EDGE CHECK PASSED');
          } finally { await browser.close(); }
          JS
      - name: Verify live Open Graph tags and share image
        run: |
          python3 - <<'PY'
          import re,struct,urllib.request
          site='https://vodotopokobliha.cz/'
          ua='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          req=urllib.request.Request(site,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=25) as response:
              assert response.status==200
              html=response.read(500_000).decode('utf-8')
          def prop(key):
              m=re.search(r'<meta\s+property="'+re.escape(key)+r'"\s+content="([^"]+)"',html)
              assert m, 'Missing '+key
              return m.group(1)
          wanted=['og:type','og:url','og:title','og:description','og:image','og:image:width','og:image:height']
          data={x:prop(x) for x in wanted}
          print('Live OG values:',data)
          assert data['og:type']=='website'
          assert data['og:url']==site
          assert data['og:image']=='https://vodotopokobliha.cz/assets/social-preview.png'
          with urllib.request.urlopen(urllib.request.Request(data['og:image'],headers={'User-Agent':ua}),timeout=25) as img:
              assert img.status==200
              print('Image Content-Type:',img.headers.get('Content-Type'))
              assert img.headers.get('Content-Type','').startswith('image/png')
              head=img.read(24)
          assert head[:8]==b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',head[16:24])
          print('Share image dimensions:',width,height)
          assert (width,height)==(int(data['og:image:width']),int(data['og:image:height']))
          print('SOCIAL METADATA CHECK PASSED. Actual Facebook/LinkedIn card appearance not verified.')
          PY
      - name: Store Edge screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-screenshots
          path: edge-*.png
          if-no-files-found: ignore
          retention-days: 7
