name: Visual production smoke test

on:
  push:
    paths:
      - .github/workflows/visual-production-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test six responsive sizes and render screenshots
        run: node scripts/visual_smoke_test.mjs
      - name: Upload visual checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-checks
          path: visual-results/
          if-no-files-found: warn
          retention-days: 14
