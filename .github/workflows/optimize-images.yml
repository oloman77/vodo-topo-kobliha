name: Optimize and localize images

on:
  push:
    paths:
      - .github/workflows/optimize-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  local-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Download and optimize all images before changing HTML
        run: python scripts/optimize_images.py
      - name: Check converted HTML and files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("index.html").read_text()
          images = re.findall(r'<img[^>]*\bsrc="([^"]+)"', page)
          assert len(images) == 6, images
          assert all(s.startswith("/assets/optimized/") for s in images), images
          for s in images:
              assert Path(s.lstrip("/")).is_file(), s
          backgrounds = re.findall(r"url\('(/assets/optimized/[^']+)'\)", page)
          assert len(backgrounds) == 1, backgrounds
          assert Path(backgrounds[0].lstrip("/")).is_file()
          assert len(list(Path("assets/optimized").glob("*.webp"))) >= 10
          print("SUCCESS: 6 local image tags, footer background, local files, consistent links")
          PY
      - name: Commit verified optimized assets
        run: |
          if [ -z "$(git status --porcelain -- index.html _headers assets/optimized)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers assets/optimized
          git commit -m "Host optimized reference and footer images locally"
          git push origin HEAD:main
